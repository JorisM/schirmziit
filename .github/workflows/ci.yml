name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: schirmziit
          POSTGRES_DB: schirmziit
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:schirmziit@localhost:5433/schirmziit
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install sqlx-cli --no-default-features --features rustls,postgres
      - run: sqlx migrate run --source crates/server/migrations
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Proves the committed offline data matches the schema, so the image build
      # (which has no database) cannot drift from the migrations.
      - run: cargo sqlx prepare --workspace --check
      - run: cargo test

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # Not only that the config parses: that every manager still matches a real
      # file. A valid config matching nothing is the silent failure here — the
      # dependencies keep looking current because nothing reads them any more.
      - run: scripts/check-renovate.sh

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Not that the config parses: that each of the four version strings it
      # rewrites is still where it says it is, and that all of them agree.
      - run: scripts/check-release-please.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Regenerates the API types from the committed spec and fails if they
      # differ — the dashboard cannot silently drift from the server.
      - run: pnpm openapi-typescript ../api/openapi.json -o src/api/schema.d.ts
        working-directory: web
      - run: git diff --exit-code web/src/api/schema.d.ts
      - run: pnpm tsc -b --noEmit
        working-directory: web
      - run: pnpm vitest run
        working-directory: web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p schirmziit-core --release
      - run: cargo run --quiet --bin uniffi-bindgen -- generate --library target/aarch64-linux-android/release/libschirmziit_core.so --language kotlin --out-dir android/app/src/main/kotlin
      # JVM tests load the core through JNA and need a host build. The build
      # re-jars src/test/resources (testNativeLibs in app/build.gradle.kts):
      # AGP drops **/*.so from the merged resource dir, so only the jar puts
      # the .so on the unit test classpath.
      - run: cargo build -p schirmziit-core --release
      - run: mkdir -p android/app/src/test/resources/linux-x86-64 && cp target/release/libschirmziit_core.so android/app/src/test/resources/linux-x86-64/
      - name: Show the host library JNA has to load
        run: |
          ls -l android/app/src/test/resources/linux-x86-64/
          file android/app/src/test/resources/linux-x86-64/libschirmziit_core.so
      # buildSrc is a separate build; Gradle builds it on demand and does not run
      # its tests as part of the app's. versionCodeOf is the one piece of build
      # logic that can silently publish an unreplaceable release.
      - run: ./gradlew -p buildSrc test
        working-directory: android
      - run: ./gradlew testDebugUnitTest
        working-directory: android
      # A screenshot failure is unreadable without the image. Keep the compare
      # PNGs from a red build so the diff can be looked at, not guessed at.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi
          path: android/app/build/outputs/roborazzi/

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install just xcodegen

      # The goldens are device-specific — recording on a different model
      # rewrites every one of them — so the simulator is named, never
      # discovered. If the runner image stops carrying it, this listing is what
      # says so, instead of thirty screenshot diffs.
      - run: xcrun simctl list devices available
      - run: xcodebuild -version

      # The same gate bin/ios-check runs. There is no second definition of it.
      - run: just ios-check
        env:
          SCHIRMZIIT_IOS_SIM: iPhone 17 Pro

      # A snapshot failure with no image is unreadable, the same reason the
      # android job keeps its Roborazzi output.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
