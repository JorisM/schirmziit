# Generated project: xcodegen keeps the Xcode project declarative, the same way
# the rest of this repo avoids clicked-together state.
#
# One app, two roles. A parent installs Schirmziit, signs in, and tells it what
# the phone is: their own (dashboard) or their child's (reporting). Two apps
# meant two store listings, two review cycles, and a parent who downloaded the
# wrong one.
name: Schirmziit
options:
  bundleIdPrefix: ch.jorisda.schirmziit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  # Everything except @main lives here. Not a style choice: the Family Controls
  # extensions cannot be installed on a simulator, so a test bundle hosted by
  # the app can never launch. Tests link this framework instead.
  SchirmziitKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Api
      - path: Sources/Design
      - path: Sources/Views
      - path: Sources/Role
      - path: AgentShared
      - path: AgentSources/Agent
      - path: AgentSources/Views
      - path: Generated/schirmziit_core.swift
      # Opaque folders, so the four locales stay four locales instead of being
      # flattened into one variant group.
      - path: Sources/Resources/en.lproj
        type: folder
      - path: Sources/Resources/de.lproj
        type: folder
      - path: Sources/Resources/fr.lproj
        type: folder
      - path: Sources/Resources/it.lproj
        type: folder
    dependencies:
      - framework: Frameworks/SchirmziitCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  Schirmziit:
    type: application
    platform: iOS
    sources:
      - path: Sources/SchirmziitApp.swift
      - path: Sources/Resources
    dependencies:
      - target: SchirmziitKit
        embed: true
      - target: SchirmziitMonitor
      - target: SchirmziitReport
    info:
      path: Sources/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Schirmziit.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Schirmziit
        TARGETED_DEVICE_FAMILY: "1,2"

  SchirmziitMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentMonitor
      - path: AgentShared
    info:
      path: AgentMonitor/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.monitor
        CODE_SIGN_ENTITLEMENTS: AgentMonitor/Monitor.entitlements
        GENERATE_INFOPLIST_FILE: NO

  SchirmziitReport:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentReport
      - path: AgentShared
    info:
      path: AgentReport/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.report
        CODE_SIGN_ENTITLEMENTS: AgentReport/Report.entitlements
        GENERATE_INFOPLIST_FILE: NO

  SchirmziitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: AgentTests
      # Copied as opaque folders: a variant group would flatten the four
      # locales into one Localizable.strings and the parity test would pass
      # while reading a single language.
      - path: Sources/Resources/en.lproj
        type: folder
      - path: Sources/Resources/de.lproj
        type: folder
      - path: Sources/Resources/fr.lproj
        type: folder
      - path: Sources/Resources/it.lproj
        type: folder
      - path: ../api/openapi.json
        buildPhase: resources
    dependencies:
      - target: SchirmziitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Schirmziit:
    build:
      targets:
        Schirmziit: all
        SchirmziitTests: [test]
    test:
      targets:
        - SchirmziitTests
