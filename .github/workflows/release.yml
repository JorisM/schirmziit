name: release

# One workflow, on purpose. A tag created with the default GITHUB_TOKEN does not
# trigger other workflows — GitHub suppresses that to stop workflows recursing —
# so the obvious shape, release-please cuts a tag and a tag-triggered workflow
# builds it, publishes nothing and says nothing. The artifact jobs hang off
# `needs: release-please` in the same run instead. That run is also the push
# that merged the Release PR, so its commit is the one the tag points at.
#
# The container image self-hosters pull is published here. While this repository
# is private the package is private too — make the package public before
# pointing outside users at ghcr.io/jorism/schirmziit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow has irreversible side effects between its start and its end —
# release-please can merge the Release PR, cut the tag and publish the GitHub
# Release before the image finishes building. Runs queue instead of
# superseding one another, so a later push can never cancel an in-flight run
# and leave a release with no image to match it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    # Runs on every push to main, release or not: `latest`, the branch tag and
    # the short sha are what the deploy from ~/Projects/home-network pins, and
    # this must not disturb them. A release adds the semver tags to the same
    # build rather than making a second one.
    #
    # `if` guards against `needs:` doing the opposite: GitHub only runs a job
    # once every job it needs has succeeded, so a release-please failure would
    # otherwise skip this job outright and stop those tags publishing too. The
    # semver tags below already disable themselves when release-please's
    # outputs are empty, so a failure degrades to exactly today's three tags.
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # type=semver is gone with the tag trigger: it reads the version off a
          # ref this workflow is never started by. The raw tags below read it
          # from release-please instead.
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }},enable=${{ needs.release-please.outputs.release_created == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 too: plenty of self-hosters run a Raspberry Pi or an ARM VPS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
