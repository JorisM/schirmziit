name: Schirmziit
options:
  bundleIdPrefix: ch.jorisda.schirmziit
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.4
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SchirmziitKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Api
      - path: Sources/Design
      - path: Sources/Views
      - path: Sources/Role
      - path: AgentShared
      - path: AgentSources/Agent
      - path: AgentSources/Views
      - path: Generated/schirmziit_core.swift
      - path: Sources/Resources/en.lproj
        type: folder
      - path: Sources/Resources/de.lproj
        type: folder
      - path: Sources/Resources/fr.lproj
        type: folder
      - path: Sources/Resources/it.lproj
        type: folder
    dependencies:
      - framework: Frameworks/SchirmziitCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.kit
        GENERATE_INFOPLIST_FILE: 'YES'
        DEFINES_MODULE: 'YES'
  Schirmziit:
    type: application
    platform: iOS
    sources:
      - path: Sources/SchirmziitApp.swift
      - path: Sources/Resources
    dependencies:
      - target: SchirmziitKit
        embed: true
      - target: SchirmziitMonitor
      - target: SchirmziitReport
    info:
      path: Sources/Resources/Info.plist
      properties: &ref_0
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleURLTypes:
          - CFBundleURLName: ch.jorisda.schirmziit.enroll
            CFBundleURLSchemes:
              - schirmziit
        NSCameraUsageDescription: >-
          Schirmziit uses the camera once, to read the pairing code your parents
          show you. Nothing is photographed, kept, or sent anywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Schirmziit.entitlements
        GENERATE_INFOPLIST_FILE: 'NO'
        TARGETED_DEVICE_FAMILY: 1,2
  SchirmziitLocal:
    type: application
    platform: iOS
    sources:
      - path: Sources/SchirmziitApp.swift
      - path: Sources/Resources
    dependencies:
      - target: SchirmziitKit
        embed: true
    info:
      path: Sources/Resources/Info.plist
      properties: *ref_0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.local
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/SchirmziitLocal.entitlements
        GENERATE_INFOPLIST_FILE: 'NO'
        TARGETED_DEVICE_FAMILY: 1,2
  SchirmziitMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentMonitor
      - path: AgentShared
    info:
      path: AgentMonitor/Info.plist
      properties:
        CFBundleDisplayName: Schirmziit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SchirmziitMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.monitor
        CODE_SIGN_ENTITLEMENTS: AgentMonitor/Monitor.entitlements
        GENERATE_INFOPLIST_FILE: 'NO'
  SchirmziitReport:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentReport
      - path: AgentShared
    info:
      path: AgentReport/Info.plist
      properties:
        CFBundleDisplayName: Schirmziit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.report
        CODE_SIGN_ENTITLEMENTS: AgentReport/Report.entitlements
        GENERATE_INFOPLIST_FILE: 'NO'
  SchirmziitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - __Snapshots__/**
      - path: AgentTests
      - path: Sources/Resources/en.lproj
        type: folder
      - path: Sources/Resources/de.lproj
        type: folder
      - path: Sources/Resources/fr.lproj
        type: folder
      - path: Sources/Resources/it.lproj
        type: folder
      - path: ../api/openapi.json
        buildPhase: resources
      - path: ../crates/core/tests/golden/enroll_qr.txt
        buildPhase: resources
    dependencies:
      - target: SchirmziitKit
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.schirmziit.tests
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  SchirmziitLocal:
    build:
      targets:
        SchirmziitLocal: all
  Schirmziit:
    build:
      targets:
        Schirmziit: all
        SchirmziitTests:
          - test
    test:
      targets:
        - SchirmziitTests
