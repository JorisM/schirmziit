server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/mime.types;
  # Relative Location headers: TLS is terminated in front of us, so an absolute
  # redirect would send the browser back to http://.
  absolute_redirect off;

  # Astro is built with format: 'file', so /self-hosting is self-hosting.html
  # and /en is en.html. A trailing slash would hit the directory next to it,
  # which only holds the sub-pages -- so strip it and keep one URL per page.
  rewrite ^/(.+)/$ /$1 permanent;

  location / { try_files $uri $uri.html $uri/ =404; }

  # Hashed assets and the font never change under the same name.
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /fonts/  { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # The pages themselves should pick up a redeploy immediately.
  location ~* \.html$ { add_header Cache-Control "no-cache"; }
}
