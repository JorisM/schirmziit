[package]
name = "schirmziit-server"
edition.workspace = true
version.workspace = true

[lib]
name = "schirmziit_server"
path = "src/lib.rs"

[[bin]]
name = "schirmziit-server"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
schirmziit-core = { path = "../core", features = ["schema"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }
tower_governor = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "macros", "migrate"] }
argon2 = "0.5"
password-hash = "0.5"
sha2 = "0.11"
rand = "0.9"
time = "0.3"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
rust-embed = "8"
mime_guess = "2"
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = "0.30"
