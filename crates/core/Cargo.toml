[package]
name = "schirmziit-core"
edition.workspace = true
version.workspace = true

[lib]
name = "schirmziit_core"
path = "src/lib.rs"
# cdylib for the Android/iOS .so; rlib so crates/server can keep depending on it
# as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = { version = "0.32.0", features = ["cli"] }
utoipa = { version = "5", features = ["chrono"], optional = true }

[features]
# Enabled by the server only: the Android build must not pull utoipa in.
schema = ["dep:utoipa"]
