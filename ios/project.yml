# Generated project: xcodegen keeps the Xcode project declarative, the same way
# the rest of this repo avoids clicked-together state.
name: Nestling
options:
  bundleIdPrefix: ch.jorisda.nestling
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Nestling:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nestling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The dashboard is on the family's own server, which may use a private
        # CA or plain http on a LAN. Users type their own address, so the
        # exception is scoped to what they choose, not to the whole app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations: [en, de, fr, it]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.nestling.viewer
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Nestling
        TARGETED_DEVICE_FAMILY: "1,2"

  NestlingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Nestling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.jorisda.nestling.viewer.tests
        # Test bundles need an Info.plist to code sign; let Xcode synthesise it
        # rather than checking in a second near-empty plist.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nestling:
    build:
      targets:
        Nestling: all
        NestlingTests: [test]
    test:
      targets:
        - NestlingTests
