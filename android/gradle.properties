# Gradle's own default daemon heap is 512 MB, which is enough for the unit and
# Roborazzi tests the gate runs but not for D8: `bin/android-install` died twice
# at :app:mergeExtDexDebug with "Gradle build daemon has been stopped: since the
# JVM garbage collector is thrashing" on a machine with 40 GB free. A ceiling,
# not a reservation — a smaller machine gives back what it does not use.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
