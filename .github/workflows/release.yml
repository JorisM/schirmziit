name: release

# One workflow, on purpose. A tag created with the default GITHUB_TOKEN does not
# trigger other workflows — GitHub suppresses that to stop workflows recursing —
# so the obvious shape, release-please cuts a tag and a tag-triggered workflow
# builds it, publishes nothing and says nothing. The artifact jobs hang off
# `needs: release-please` in the same run instead. That run is also the push
# that merged the Release PR, so its commit is the one the tag points at.
#
# RELEASE_PLEASE_TOKEN below lifts that suppression for the tag as well, but
# the shape stays: there is no tag trigger to fire, and adding one would build
# the same commit a second time.
#
# The container image self-hosters pull is published here. A package inherits
# the repository's visibility only when it is first created, and this one was
# created private; making the repository public does not follow it, and there is
# no REST endpoint that does either. If `docker compose up` starts answering 401
# for outside users, the package settings page is where that is fixed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow has irreversible side effects between its start and its end —
# release-please can merge the Release PR, cut the tag and publish the GitHub
# Release before the image finishes building. Runs queue instead of
# superseding one another, so a later push can never cancel an in-flight run
# and leave a release with no image to match it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # release-please itself works entirely over the API and needs no
      # checkout; the lockfile step below does, and it pushes, so it needs the
      # same token for the same reason — a push made with GITHUB_TOKEN starts
      # no workflow, and a release commit that skips ci.yml is the thing this
      # file already went out of its way to prevent.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # The same reason renovate.yml uses RENOVATE_TOKEN: a pull request
          # opened with the workflow's own GITHUB_TOKEN does not start ci.yml.
          # Release PRs #55 and #58 both merged with no test results at all —
          # every run against them held at action_required with zero jobs — and
          # a release is the last pull request that should merge unproven.
          #
          # Unset (a fork, or before the secret exists) falls back to
          # GITHUB_TOKEN, and that still cuts the release, but only while the
          # release commit is the head of main: GitHub refuses create-a-release
          # from a workflow token when target_commitish is any older commit,
          # with "Resource not accessible by integration" and contents:write
          # granted. So a cancelled or failed release run cannot be recovered
          # by re-running it once main has moved on — v0.3.0's tag had to be
          # created by hand. A user PAT has no such restriction.
          #
          # Needs contents:write and pull-requests:write and nothing else.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Cargo.lock records the workspace members' own versions, and nothing in
      # release-please updates it: the "simple" release type has no Cargo
      # updater, and a lockfile cannot carry an x-release-please-version marker
      # because cargo rewrites the file. So every release left the lockfile a
      # version behind, which dirties the tree on the next build anyone runs
      # and makes a --locked build disagree with the manifests it was told to
      # build. Fixed twice by hand before this step existed.
      #
      # --offline and --workspace: nothing here may reach the network or move a
      # third-party pin. The only lines that change are the three workspace
      # members, and if none do, there is nothing to commit and nothing to push.
      #
      # The branch name is parsed in the shell, not with fromJSON in `env`. A
      # release run leaves `outputs.pr` empty, fromJSON('') is a template
      # error, and a template error fails the step whatever its `if` says — so
      # the shape that reads naturally took the whole job down on exactly the
      # runs that had just cut a release, which skipped the android job and
      # left the releases page with no APK. 0.3.0 lost its artifacts that way.
      - if: ${{ steps.release.outputs.pr }}
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH=$(printf '%s' "$PR" | jq -r '.headBranchName')
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          cargo update --workspace --offline
          if git diff --quiet -- Cargo.lock; then
            echo "the lockfile already carries this version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Cargo.lock for the release" -- Cargo.lock
          git push origin "$BRANCH"

  image:
    # Runs on every push to main, release or not: `latest`, the branch tag and
    # the short sha are what the deploy from ~/Projects/home-network pins, and
    # this must not disturb them. A release adds the semver tags to the same
    # build rather than making a second one.
    #
    # `if` guards against `needs:` doing the opposite: GitHub only runs a job
    # once every job it needs has succeeded, so a release-please failure would
    # otherwise skip this job outright and stop those tags publishing too. The
    # semver tags below already disable themselves when release-please's
    # outputs are empty, so a failure degrades to exactly today's three tags.
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # type=semver is gone with the tag trigger: it reads the version off a
          # ref this workflow is never started by. The raw tags below read it
          # from release-please instead.
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }},enable=${{ needs.release-please.outputs.release_created == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 too: plenty of self-hosters run a Raspberry Pi or an ARM VPS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p schirmziit-core --release
      - run: cargo run --quiet --bin uniffi-bindgen -- generate --library target/aarch64-linux-android/release/libschirmziit_core.so --language kotlin --out-dir android/app/src/main/kotlin

      # The release key is a GitHub secret because it can be nowhere else: it is
      # what every installed copy of the app recognises, so losing it means no
      # future release can upgrade one. The original lives in the password
      # manager; this is a copy, and a secret cannot be read back out of GitHub.
      #
      # A fork has neither secret, and that is not an error — it gets the
      # unsigned build this workflow published before the key existed. An unset
      # secret expands to the empty string, which Gradle reads as "no keystore"
      # (android/buildSrc/src/main/kotlin/ReleaseSigning.kt).
      - name: Write out the keystore, if this repository has one
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::no ANDROID_KEYSTORE_B64 — this release will be unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - run: ./gradlew assembleRelease bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # The name says which one it is. An APK with no signature cannot be
      # installed on any phone, and a file called schirmziit-agent-0.2.0.apk on
      # a release page reads like one that can — so the unsigned build keeps the
      # suffix it had, and only a signed one loses it.
      - name: Name the artifacts for what they are
        id: artifacts
        run: |
          set -euo pipefail
          v='${{ needs.release-please.outputs.version }}'
          mkdir -p dist
          if [ -n '${{ steps.keystore.outputs.path }}' ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/schirmziit-agent-$v.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/schirmziit-agent-$v.aab"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/schirmziit-agent-$v-unsigned.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab \
               "dist/schirmziit-agent-$v-unsigned.aab"
          fi
          ls -l dist/

      # A half-configured keystore, a build that fell back to unsigned, a
      # different key: all three end as a download that fails on the phone with
      # nothing to explain it. The fingerprint is the app's identity to every
      # device that already has it, so it is checked here rather than trusted.
      - name: The releases page must never carry an APK a phone refuses
        if: steps.keystore.outputs.path != ''
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/*.apk | tee certs.txt
          grep -qi 'certificate SHA-256 digest: e3b841582a7a0b5b1d82f7bffb97d17196096694554116da83c6d0dc7aa93ee4' certs.txt

      - run: gh release upload '${{ needs.release-please.outputs.tag_name }}' dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
